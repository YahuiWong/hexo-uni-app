name: "✨ 功能建议"
description: 提出新功能或改进现有功能的想法
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！在提交之前，请先搜索已有 Issues，避免重复提交。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 使用场景
      description: 请描述你希望解决什么问题，或者这个功能能带来什么价值
      placeholder: 例如：希望能支持自定义主题色，目前只能切换深色/浅色模式
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你设想的具体方案
      description: 如果你已经想到了实现方式，请描述出来

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否有其他可以达成同样目的的方式？

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 其他有助于理解这个建议的信息（截图、参考项目等）