name: 微信小程序 CI/CD

on:
  # 当推送到 main 分支时触发
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

  # 支持手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: true
        default: '1.0.0'
      description:
        description: '版本描述'
        required: true
        default: '自动构建版本'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. 设置 pnpm
      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      # 4. 获取 pnpm store 目录
      - name: 获取 pnpm store 目录
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      # 5. 缓存依赖
      - name: 缓存 pnpm 依赖
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 6. 安装依赖
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 7. 安装微信小程序 CI 工具
      - name: 安装 miniprogram-ci
        run: pnpm add -D miniprogram-ci

      # 8. 构建微信小程序
      - name: 构建微信小程序
        run: pnpm run build:mp-weixin

      # 9. 创建上传密钥文件
      - name: 创建上传密钥
        run: echo "${{ secrets.WEIXIN_PRIVATE_KEY }}" > private.key

      # 10. 上传到微信小程序
      - name: 上传代码到微信平台
        env:
          APPID: ${{ secrets.WEIXIN_APPID }}
          VERSION: ${{ github.event.inputs.version || '1.0.0' }}
          DESCRIPTION: ${{ github.event.inputs.description || '自动构建版本' }}
        run: |
          node scripts/upload-weixin.js

      # 11. 清理密钥文件
      - name: 清理密钥文件
        if: always()
        run: rm -f private.key

      # 12. 上传构建产物（可选，用于调试）
      - name: 上传构建产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-mp-weixin
          path: dist/build/mp-weixin
          retention-days: 7
